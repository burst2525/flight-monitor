name: Flight Price Monitor (大阪発 格安航空券監視)

on:
  workflow_dispatch: # 外部タイマー (cron-job.org) または 手動実行からトリガー

jobs:
  check-flights:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 前回の価格履歴をキャッシュから復元 (相場学習 & 重複通知防止)
      - name: 価格履歴の復元
        uses: actions/cache@v4
        with:
          path: price_history.json
          key: flight-history-${{ github.run_id }}
          restore-keys: |
            flight-history-

      - name: 格安航空券のリアルタイム監視・iPhone通知を実行
        env:
          # 暗号化金庫(Secrets)から安全にトピック名を取得
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python main.py --all-routes
