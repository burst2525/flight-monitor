name: Flight Price Monitor (大阪発 格安航空券監視)

on:
  schedule:
    # =========================================================================
    # 【起きてる時間：超高頻度巡回】
    # 日本時間(JST) 07:00 〜 24:00 まで「毎時 1時間おき」にチェック！
    # セールが始まったら売り切れる前に最速でiPhoneへプッシュ通知
    # (UTC 0:00〜15:00, 22:00, 23:00)
    # =========================================================================
    - cron: '0 0-15,22,23 * * *'

    # =========================================================================
    # 【就寝中：深夜の通知を抑制】
    # 日本時間(JST) 深夜 03:30 に1回だけチェック (UTC 18:30)
    # =========================================================================
    - cron: '30 18 * * *'

  workflow_dispatch: # GitHub画面から手動でいつでも即時実行可能

jobs:
  check-flights:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 前回の価格履歴をキャッシュから復元 (相場学習 & 重複通知防止)
      - name: 価格履歴の復元
        uses: actions/cache@v4
        with:
          path: price_history.json
          key: flight-history-${{ github.run_id }}
          restore-keys: |
            flight-history-

      - name: 格安航空券のリアルタイム監視・iPhone通知を実行
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'flight-alert-osaka-hiroki' }}
        run: |
          python main.py --all-routes
