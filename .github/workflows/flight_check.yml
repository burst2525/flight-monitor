name: Flight Price Monitor (大阪発 格安航空券監視)

on:
  schedule:
    # =========================================================================
    # 【起きてる時間：極限スピード 5分おき監視】
    # 日本時間(JST) 07:00 〜 24:00 まで「5分おき」に自動巡回！
    # ゲリラセール・数量限定チケットが出た瞬間に、最速でiPhoneへ通知します。
    # (UTC 0:00〜15:00, 22:00, 23:00 の毎時 5分刻み)
    # =========================================================================
    - cron: '*/5 0-15,22,23 * * *'

    # =========================================================================
    # 【就寝中：深夜の通知を抑制】
    # 日本時間(JST) 深夜 03:30 に1回だけチェック (UTC 18:30)
    # =========================================================================
    - cron: '30 18 * * *'

  workflow_dispatch: # GitHub画面から手動でいつでも即時実行可能

jobs:
  check-flights:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 前回の価格履歴をキャッシュから復元 (相場学習 & 重複通知防止)
      - name: 価格履歴の復元
        uses: actions/cache@v4
        with:
          path: price_history.json
          key: flight-history-${{ github.run_id }}
          restore-keys: |
            flight-history-

      - name: 格安航空券のリアルタイム監視・iPhone通知を実行
        env:
          # 暗号化金庫(Secrets)から安全にトピック名を取得 (公開リポジトリでも完全に安全)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python main.py --all-routes
