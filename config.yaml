# ==========================================
# 航空券 格安監視設定ファイル (大阪拠点)
# ==========================================

# 1. 出発地設定
origin:
  code: "KIX"          # 関西国際空港 (KIX)
  name: "大阪(関空)"

# 2. 格安判定ルール (通常価格からの下落率 & 予算上限)
alert_criteria:
  discount_threshold_percent: 40   # 通常相場より【40%以上OFF】の目玉セールのみ厳選通知！
  cooldown_hours: 999              # 同じ価格の再通知は完全停止 (最安値更新時のみ通知)

  # 【予算上限ルール】この価格以下なら無条件で即通知！（往復総額 JPY）
  budget_limits:
    # --- 🇯🇵 日本 (国内) ---
    OKA: 15000       # 沖縄(那覇)
    ISG: 18000       # 沖縄(石垣島)
    SHI: 16000       # 沖縄(下地島/宮古)
    CTS: 14000       # 北海道(札幌/新千歳)

    # --- 🇹🇼 台湾 ---
    TPE: 20000       # 台湾(台北)
    KHH: 19000       # 台湾(高雄)

    # --- 🇰🇷 韓国 ---
    ICN: 18000       # 韓国(ソウル)
    PUS: 14000       # 韓国(釜山)

    # --- 🇭🇰 香港 ---
    HKG: 24000       # 香港

    # --- 🇹🇭 タイ ---
    BKK: 32000       # タイ(バンコク)

    # --- 🇻🇳 ベトナム ---
    DAD: 28000       # ベトナム(ダナン)
    HAN: 27000       # ベトナム(ハノイ)
    SGN: 28000       # ベトナム(ホーチミン)

    # --- 🇵🇭 フィリピン ---
    CEB: 26000       # フィリピン(セブ島)

    # --- 🇲🇾 マレーシア ---
    KUL: 32000       # マレーシア(クアラルンプール)

    # --- 🇸🇬 シンガポール ---
    SIN: 33000       # シンガポール

    # --- 🇲🇾🇸🇬 マレーシア・シンガポール周遊 ---
    KUL_SIN: 36000   # 周遊 (マレーシア行き・シンガポール帰り)
    SIN_KUL: 36000   # 周遊 (シンガポール行き・マレーシア帰り)

    # --- 🇮🇩 インドネシア ---
    DPS: 38000       # インドネシア(バリ島)

    # --- 🇹🇷 トルコ ---
    IST: 78000       # トルコ(イスタンブール)

    # --- 🇪🇺 東欧 ---
    BUD: 85000       # ハンガリー(ブダペスト)
    PRG: 85000       # チェコ(プラハ)
    WAW: 85000       # ポーランド(ワルシャワ)

    # --- 🇪🇬 エジプト ---
    CAI: 75000       # エジプト(カイロ)

    # --- 🇬🇪 ジョージア ---
    TBS: 78000       # ジョージア(トビリシ)

# 3. iPhone通知設定 (ntfy.sh)
notification:
  topic: "YOUR_NTFY_TOPIC"        # GitHub Secrets (NTFY_TOPIC) から自動取得
  server: "https://ntfy.sh"
  priority: "high"

# 4. 【ゴールデンウィーク専用監視設定 (2027年)】
gw_focus:
  enabled: true
  departure_dates:
    - "2027-04-28"  # 水 (前夜発)
    - "2027-04-29"  # 木 (昭和の日・祝日)
    - "2027-04-30"  # 金 (有給推奨)
    - "2027-05-01"  # 土
    - "2027-05-02"  # 日
  return_dates:
    - "2027-05-04"  # 火 (みどりの日・祝日)
    - "2027-05-05"  # 水 (こどもの日・祝日)
    - "2027-05-06"  # 木
    - "2027-05-08"  # 土
    - "2027-05-09"  # 日 (連休最終日)

# 5. 【おすすめ厳選 監視対象ルート一覧】
routes:
  # ==========================================
  # --- 【国内：人気リゾート＆主要都市】 ---
  # ==========================================
  - destination: "OKA"
    name: "沖縄(那覇)"
    category: "国内リゾート"
    trip_days: [3, 4]

  - destination: "ISG"
    name: "沖縄(石垣島)"
    category: "国内リゾート"
    trip_days: [3, 4]

  - destination: "SHI"
    name: "沖縄(下地島/宮古)"
    category: "国内リゾート"
    trip_days: [3, 4]

  - destination: "CTS"
    name: "北海道(札幌/新千歳)"
    category: "国内人気都市"
    trip_days: [3, 4]

  # ==========================================
  # --- 【東アジア：近場・グルメ・LCC激戦区】 ---
  # ==========================================
  - destination: "TPE"
    name: "台湾(台北)"
    category: "東アジア"
    trip_days: [3, 4, 5]

  - destination: "KHH"
    name: "台湾(高雄)"
    category: "東アジア"
    trip_days: [3, 4]

  - destination: "ICN"
    name: "韓国(ソウル)"
    category: "東アジア"
    trip_days: [3, 4]

  - destination: "PUS"
    name: "韓国(釜山)"
    category: "東アジア"
    trip_days: [2, 3]

  - destination: "HKG"
    name: "香港"
    category: "東アジア"
    trip_days: [3, 4]

  # ==========================================
  # --- 【東南アジア：物価安・極上リゾート】 ---
  # ==========================================
  - destination: "BKK"
    name: "タイ(バンコク)"
    category: "東南アジア"
    trip_days: [4, 5, 6]

  - destination: "DAD"
    name: "ベトナム(ダナン)"
    category: "東南アジアリゾート"
    trip_days: [4, 5]

  - destination: "HAN"
    name: "ベトナム(ハノイ)"
    category: "東南アジア"
    trip_days: [4, 5]

  - destination: "SGN"
    name: "ベトナム(ホーチミン)"
    category: "東南アジア"
    trip_days: [4, 5]

  - destination: "CEB"
    name: "フィリピン(セブ島)"
    category: "東南アジアリゾート"
    trip_days: [4, 5]

  - destination: "KUL"
    name: "マレーシア(クアラルンプール)"
    category: "東南アジア"
    trip_days: [4, 5, 6]

  - destination: "SIN"
    name: "シンガポール"
    category: "東南アジア"
    trip_days: [4, 5]

  - destination: "DPS"
    name: "インドネシア(バリ島)"
    category: "東南アジアリゾート"
    trip_days: [5, 6, 7]

  # ==========================================
  # --- 【周遊：複数都市・オープンジョー】 ---
  # ==========================================
  - destination: "KUL_SIN"
    name: "マレーシア➔シンガポール周遊"
    category: "東南アジア周遊"
    is_open_jaw: true
    outbound_dest: "KUL"     # 行き：大阪 ➔ クアラルンプール
    inbound_origin: "SIN"    # 帰り：シンガポール ➔ 大阪
    trip_days: [4, 5, 6]

  - destination: "SIN_KUL"
    name: "シンガポール➔マレーシア周遊"
    category: "東南アジア周遊"
    is_open_jaw: true
    outbound_dest: "SIN"     # 行き：大阪 ➔ シンガポール
    inbound_origin: "KUL"    # 帰り：クアラルンプール ➔ 大阪
    trip_days: [4, 5, 6]

  # ==========================================
  # --- 【ヨーロッパ・周辺：物価安・歴史遺産】 ---
  # ==========================================
  - destination: "IST"
    name: "トルコ(イスタンブール)"
    category: "中東・ヨーロッパ"
    trip_days: [7, 8, 9, 10, 11]

  - destination: "BUD"
    name: "ハンガリー(ブダペスト)"
    category: "東欧"
    trip_days: [7, 8, 9, 10, 11]

  - destination: "PRG"
    name: "チェコ(プラハ)"
    category: "東欧"
    trip_days: [7, 8, 9, 10, 11]

  - destination: "WAW"
    name: "ポーランド(ワルシャワ)"
    category: "東欧"
    trip_days: [7, 8, 9, 10, 11]

  - destination: "CAI"
    name: "エジプト(カイロ)"
    category: "中東・アフリカ"
    trip_days: [7, 8, 9, 10, 11]

  - destination: "TBS"
    name: "ジョージア(トビリシ)"
    category: "コーカサス・物価安"
    trip_days: [7, 8, 9, 10, 11]
