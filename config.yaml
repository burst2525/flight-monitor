# ==========================================
# 航空券 格安監視設定ファイル (大阪拠点)
# ==========================================

# 1. 出発地設定
origin:
  code: "KIX"          # 関西国際空港 (KIX)
  name: "大阪(関空)"

# 2. 格安判定ルール (通常価格からの下落率)
alert_criteria:
  discount_threshold_percent: 40   # 通常相場より【40%以上OFF】の目玉セールのみ厳選通知！
  cooldown_hours: 999              # 同じ価格の再通知は完全停止 (最安値更新時のみ通知)

# 3. iPhone通知設定 (ntfy.sh)
notification:
  topic: "YOUR_NTFY_TOPIC"        # GitHub Secrets (NTFY_TOPIC) から自動取得
  server: "https://ntfy.sh"
  priority: "high"

# 4. 【ゴールデンウィーク専用監視設定 (2027年)】
gw_focus:
  enabled: true
  departure_dates:
    - "2027-04-28"  # 水 (前夜発)
    - "2027-04-29"  # 木 (昭和の日・祝日)
    - "2027-04-30"  # 金 (有給推奨)
    - "2027-05-01"  # 土
    - "2027-05-02"  # 日
  return_dates:
    - "2027-05-04"  # 火 (みどりの日・祝日)
    - "2027-05-05"  # 水 (こどもの日・祝日)
    - "2027-05-06"  # 木
    - "2027-05-08"  # 土
    - "2027-05-09"  # 日 (連休最終日)

# 5. 【おすすめ厳選 監視対象ルート一覧】
routes:
  # ==========================================
  # --- 【国内：人気リゾート＆主要都市】 ---
  # ==========================================
  - destination: "OKA"
    name: "沖縄(那覇)"
    category: "国内リゾート"
    trip_days: [3, 4]

  - destination: "ISG"
    name: "沖縄(石垣島)"
    category: "国内リゾート"
    trip_days: [3, 4]

  - destination: "SHI"
    name: "沖縄(下地島/宮古)"
    category: "国内リゾート"
    trip_days: [3, 4]

  - destination: "CTS"
    name: "北海道(札幌/新千歳)"
    category: "国内人気都市"
    trip_days: [3, 4]

  # ==========================================
  # --- 【東アジア：近場・グルメ・LCC激戦区】 ---
  # ==========================================
  - destination: "TPE"
    name: "台湾(台北)"
    category: "東アジア"
    trip_days: [3, 4, 5]

  - destination: "KHH"
    name: "台湾(高雄)"
    category: "東アジア"
    trip_days: [3, 4]

  - destination: "ICN"
    name: "韓国(ソウル)"
    category: "東アジア"
    trip_days: [3, 4]

  - destination: "PUS"
