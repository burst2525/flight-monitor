    name: "マレーシア➔シンガポール周遊"
    category: "東南アジア周遊"
    is_open_jaw: true
    outbound_dest: "KUL"     # 行き：大阪 ➔ クアラルンプール
    inbound_origin: "SIN"    # 帰り：シンガポール ➔ 大阪
    trip_days: [4, 5, 6]

  - destination: "SIN_KUL"
    name: "シンガポール➔マレーシア周遊"
    category: "東南アジア周遊"
    is_open_jaw: true
    outbound_dest: "SIN"     # 行き：大阪 ➔ シンガポール
    inbound_origin: "KUL"    # 帰り：クアラルンプール ➔ 大阪
    trip_days: [4, 5, 6]

  # ==========================================
